# buzz-ai — local single-host run (Docker Desktop).
# Non-secret config is inline (safe to commit). The 12 SECRETS are NOT here — they
# are injected at runtime from Bitwarden Secrets Manager via start.sh, and passed
# through by name (the bare entries under "secrets, injected at runtime").
#
# Start:  ./start.sh          (fetches secrets from Bitwarden, then compose up)
# Stop:   docker compose down

services:
  agents:
    # Build locally the first time (works at home; no corporate TLS proxy).
    # Once you publish to GHCR, swap to:  image: ghcr.io/yc2897/buzz-ai:latest
    build: .
    image: buzz-ai:local
    restart: unless-stopped
    environment:
      # ── non-secret config (public — fine to commit) ──
      - BUZZ_RELAY_URL=wss://yc2897.communities.buzz.xyz
      - BUZZ_ACP_AGENT_OWNER=f6e23876ed6c7c82486c371a0f577f08c3d7025008a35900be0b7129757a1122
      - CLAUDE_MODEL=claude-opus-4-8
      - CODEX_MODEL=gpt-5.5
      - CLAUDE_EFFORT=high
      - CODEX_EFFORT=high
      - CAREER_ALLOWLIST=470eb7cb7f04caef853a7f9e0eb03f2d9a9ed53a2fd1bd9d995864492d41ffc6,9f432ab55996b6ed230e69425f4330d9ca2d21e2598acd24450197e8f068a01c,ac959d5b75cde87e7f3cff3359aa0f08a37177cae8f847a9bd02a2cf6cad6845,a294106f364b8cf1a0237b122defbcee31cc149a00c910a791b0d71c4b234075
      - OPERATIONS_ALLOWLIST=73def8e8c09b32f6702cc59399a450c9441099962becd2855551fceaa8dc7a35,9f432ab55996b6ed230e69425f4330d9ca2d21e2598acd24450197e8f068a01c,ac959d5b75cde87e7f3cff3359aa0f08a37177cae8f847a9bd02a2cf6cad6845,a294106f364b8cf1a0237b122defbcee31cc149a00c910a791b0d71c4b234075
