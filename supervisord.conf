; supervisord config — the "keep-everything-running" program.
;
; Docker runs supervisord as the container's one process. supervisord runs the 5
; agents below and restarts any that crash. Program names map to your org:
;
;   career       = Career           (Claude Code)
;   operations   = Operations       (Claude Code)
;   knowledge    = Knowledge        (Claude Code)
;   redteam      = Red Team         (Codex / GPT)
;   engineering  = Engineering      (Codex / GPT)
;
; Each agent's identity + allowlist come from env vars (see run-agent.sh).

[supervisord]
nodaemon=true                 ; run in the foreground (required inside a container)
logfile=/dev/null             ; supervisord's own chatter; agent logs go to stdout below
pidfile=/tmp/supervisord.pid

; ── shared options applied to every agent ──────────────────────────────────
; (repeated per program; supervisord has no real "inherit" mechanism)

[program:career]
command=/usr/local/bin/run-agent.sh CAREER
autostart=true
autorestart=true
startsecs=5
startretries=1000000          ; keep retrying forever on transient failures
stdout_logfile=/dev/stdout    ; stream this agent's logs to the container (docker logs)
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=15

[program:operations]
command=/usr/local/bin/run-agent.sh OPERATIONS
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=15

[program:knowledge]
command=/usr/local/bin/run-agent.sh KNOWLEDGE
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
stopsignal=TERM
stopwaitsecs=15

[program:redteam]
command=/usr/local/bin/run-agent.sh REDTEAM
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stdout_logfile=/dev/stdout
